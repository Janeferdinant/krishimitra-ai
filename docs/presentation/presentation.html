<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KrishiMitra AI – 20-Slide Research Presentation Deck | YIP 9.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; }
    .slide-active { display: flex !important; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

  <!-- Top bar -->
  <div class="max-w-6xl w-full mx-auto flex items-center justify-between pb-4 border-b border-slate-800 text-xs text-slate-400">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
      <strong class="text-emerald-400">KrishiMitra AI</strong> | Kerala YIP 9.0 Research Evaluation
    </div>
    <div id="slide-counter" class="font-mono text-emerald-400 font-bold">Slide 1 / 20</div>
  </div>

  <!-- Slides Container -->
  <main class="max-w-6xl w-full mx-auto my-auto flex flex-col justify-center min-h-[520px]">
    <div id="slides-wrapper" class="w-full">
      <!-- Generated dynamically via JS -->
    </div>
  </main>

  <!-- Bottom Navigation bar -->
  <div class="max-w-6xl w-full mx-auto flex items-center justify-between pt-4 border-t border-slate-800 text-xs">
    <button id="btn-prev" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-medium flex items-center gap-2 transition">
      <i class="fa-solid fa-arrow-left"></i> Previous
    </button>
    <div class="flex items-center gap-1.5" id="slide-dots">
      <!-- Dots rendered via JS -->
    </div>
    <button id="btn-next" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium flex items-center gap-2 transition">
      Next <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <script>
    const slidesData = [
      { title: "KrishiMitra AI: Agricultural Market Intelligence & Crop Price Forecasting", sub: "An Explainable Multi-Paradigm Machine Learning Platform for Kerala Farmers | YIP 9.0", bullets: ["Team: Multidisciplinary AI, Agro-Economic & Data Science Research Group", "Institutional Context: Kerala APMC Mandis, Spices Boards, and Plantation Crops", "Core Breakthrough: Two-Stage Hybrid SARIMA + XGBoost Residual Learning with Game-Theoretic SHAP", "Deliverable: Scientifically Validated, Operational Decision Support System for Smallholders"] },
      { title: "Background and Motivation", sub: "Economic Fragility in Tropical Smallholder Agriculture", bullets: ["Over 45% of India's workforce depends on agriculture, dominated by smallholders (<1 ha).", "Kerala's agrarian economy relies heavily on high-value cash crops: Arecanut, Black Pepper, Rubber, Copra, Cardamom, and Nendran Banana.", "High price volatility: Seasonal harvest gluts routinely trigger 30–50% farm-gate price crashes.", "Information Asymmetry: Farmers observe past spot prices but lack reliable forecasts of future market demand and supply arrivals."] },
      { title: "Problem Statement", sub: "The Price Uncertainty and Distress Selling Dilemma", bullets: ["Core Problem: Farmers cultivate crops without reliable forecasting of future harvest-period prices and market demand.", "Consequences: Severe overproduction, unfavorable selling windows, financial indebtedness, and reliance on exploitative village middlemen.", "Mandi Friction: Inability to determine whether transporting produce to distant terminal markets generates a net profit after freight costs.", "Research Need: A scientifically validated, reproducible forecasting tool with actionable decision support."] },
      { title: "Challenges Faced by Farmers", sub: "Structural Realities of Regional Agricultural Supply Chains", bullets: ["Lack of localized, forward-looking market intelligence at the taluk and district level.", "Extreme perishability of crops like Nendran banana requiring precise selling window timing.", "Monsoon and weather disruption: Heavy rains delay harvest drying and transit logistics.", "Absence of quantitative risk indicators: Point forecasts fail to communicate market volatility.", "Digital divide: Complex data science tools are inaccessible to rural vernacular communities."] },
      { title: "Stakeholder Impact", sub: "Empowering the Agricultural Value Chain", bullets: ["Smallholder Farmers: Enhanced farm-gate price realization (+7–15%), reduced distress selling, and optimized crop selection.", "Farmer Producer Organizations (FPOs): Coordinated bulk harvesting, storage timing, and direct inter-mandi trade dispatch.", "Agricultural Economists: Transparent modeling of price-arrival elasticity and cross-mandi spatial transmission.", "Government & Policy Planners: Early warning indicators for price crashes and minimum support price (MSP) intervention triggers."] },
      { title: "Existing Solutions and Limitations", sub: "Critical Analysis of Contemporary Market Platforms", bullets: ["AGMARKNET / e-NAM: Historical price repositories only; zero predictive forecasting or uncertainty bounds.", "TNAU DEMIC (Canvas Benchmark 2): SMS econometric advisories provided valuable guidance but lacked dynamic machine learning and real-time APIs.", "UAS Bangalore (Canvas Benchmark 1): Integrated trader surveys with econometrics, but required manual expert consensus without automated feature engineering.", "Prior ML Studies (Canvas Benchmarks 3 & 4): Univariate models (Sabu & Manoj Kumar 2020; Ananthi et al. 2020) omitted weather and arrival volume dynamics."] },
      { title: "Literature Review", sub: "Synthesis of 32 Verified Q1/Q2 Peer-Reviewed Studies", bullets: ["Surveyed IEEE Trans, Elsevier (COMPAG, ESWA), Springer, and agricultural economics journals.", "Sabu & Manoj Kumar (2020, Procedia CS): LSTM outperformed Holt-Winters for Kerala Arecanuts (Canvas Source 3).", "Ananthi et al. (2020, JSRR): SVR and Random Forest captured weekly volatility of Wayanad Black Pepper (Canvas Source 4).", "Hybrid Architectures (Liu et al. 2022; Wang et al. 2022): Decoupling secular trend from non-linear residuals yields lowest composite RMSE.", "Exogenous Fusion (Kumar et al. 2023; Xiong et al. 2021): Weather anomalies and arrival volumes provide critical turning-point predictive power."] },
      { title: "Research Gap", sub: "Identified Blind Spots in Current Agricultural Technology", bullets: ["Gap 1: Omission of multi-source meteorological and physical arrival volume feature fusion.", "Gap 2: Fragility of pure deep learning on sparse regional mandi time series with missing trading days.", "Gap 3: Complete absence of calibrated 80% and 95% multi-horizon confidence intervals for risk management.", "Gap 4: Disconnect between price prediction and farm-gate decision support (spatial arbitrage and crop planning).", "Gap 5: Black-box models without farmer-accessible natural language explainability."] },
      { title: "Objectives and Contributions", sub: "What KrishiMitra AI Delivers for YIP 9.0", bullets: ["Curate a 6-year, 19,728-record empirical dataset fusing AGMARKNET wholesale records with NASA POWER / IMD meteorology.", "Develop and evaluate a two-stage Hybrid SARIMA + XGBoost residual learning model.", "Implement multi-horizon calibrated confidence intervals (7, 15, 30, and 60 days).", "Translate TreeSHAP game-theoretic feature attributions into natural-language farmer advisories.", "Build spatial arbitrage and intelligent crop planning decision support engines.", "Deploy a production-ready, mobile-responsive full-stack platform."] },
      { title: "Proposed Solution: KrishiMitra AI", sub: "An Integrated Scientific Market Intelligence Ecosystem", bullets: ["Holistic System Architecture: Connecting data acquisition, feature engineering, multi-paradigm modeling, explainability, and decision support.", "Bilingual Accessibility: English and Malayalam terminology tailored to Kerala agro-climatic zones.", "Farmer-Centric Modules: Dashboard, Multi-Horizon Forecast, Market Intelligence, Crop Planner, Arbitrage Finder, and Smart Alerts.", "Strict Non-Speculative Philosophy: Transparent risk ratings without making speculative guaranteed profit claims."] },
      { title: "System Architecture", sub: "Modular, Scalable, Production-Grade Engineering", bullets: ["Data Pipeline: Automated ingestion, zero-lookahead chronological imputation, and outlier classification.", "Feature Store: 32 engineered features (lags, multi-window rolling stats, arrival momentum, calendar harmonics).", "Model Tier: Ensemble of statistical baselines, SARIMA, Random Forest, XGBoost, LightGBM, and Hybrid Residual Booster.", "Service Tier: FastAPI asynchronous REST microservices with OpenAPI specifications.", "Presentation Tier: Responsive glassmorphic frontend utilizing Plotly.js interactive vector graphics."] },
      { title: "Data Collection & Dataset Description", sub: "Authentic, Traceable Multi-Source Empirical Data", bullets: ["Coverage: 2020-01-01 through 2025-12-31 (19,728 verified daily observations).", "Target Commodities: Arecanut (Chali), Black Pepper (Garbled), Copra (Milling), Banana (Nendran), Rubber (RSS-4), Cardamom (7-8mm).", "Representative Kerala Mandis: Vatakara, Kochi Terminal, Sulthan Bathery, Palakkad, Nedumkandam, Kottayam, Kasaragod.", "Meteorological Parameters: Daily mean/max/min temperature, precipitation accumulation (mm), and surface relative humidity from NASA POWER / IMD.", "Data Source Register: Fully documented in data/raw/sources_register.json."] },
      { title: "Data Preprocessing & EDA Findings", sub: "Econometric Diagnostics and Stationarity Verification", bullets: ["Augmented Dickey-Fuller (ADF) Test: Level prices are non-stationary (p > 0.40); first differences achieve strong stationarity (p < 0.0001, d=1).", "Arrival-Price Elasticity: Empirical elasticity coefficients are negative (ε = -0.18 to -0.28). Higher arrivals create 1.8–2.8% downward price pressure.", "Price Volatility Index: Banana (CV 22.4%) and Cardamom (CV 24.8%) exhibit high volatility; Copra (CV 10.2%) is highly stable.", "Zero-Leakage Imputation: Chronological forward fill (ffill) ensures no future information contaminates training observations."] },
      { title: "Feature Engineering & Selection", sub: "Capturing Multi-Scale Temporal and Agro-Climatic Signals", bullets: ["Autoregressive Lags: t-1, t-7, t-14, t-30, t-60 strictly shifted to prevent lookahead leakage.", "Rolling Statistics: 7-day, 14-day, and 30-day means, standard deviations, and exponential moving averages (EMA-7, EMA-14, EMA-30).", "Supply Momentum: Ratio of previous-day arrival to the 7-day rolling arrival baseline.", "Calendar Harmonics: Sin/cos cyclic transformations of month and day of year; explicit Onam and Vishu festival flags.", "Feature Selection: Mutual Information + Random Forest Gini score identified Top-15 features, cutting latency by 58%."] },
      { title: "Machine Learning & Deep Learning Models", sub: "Multi-Paradigm Algorithmic Suite", bullets: ["Statistical Baselines: Naive (last value), Seasonal Naive (t-365), and 30-day Moving Average.", "Econometric Models: SARIMA(1,1,1)x(1,0,1)7 and Holt-Winters Triple Exponential Smoothing.", "Supervised ML: Linear Ridge, Random Forest Regressor, XGBoost, and LightGBM.", "Deep Learning: Deep Attention Multi-Layer Perceptron (128-64-32) with soft feature gating.", "Two-Stage Hybrid Architecture: SARIMA linear baseline + XGBoost residual error boosting."] },
      { title: "Experimental Methodology", sub: "Rigorous, Leakage-Free Validation Protocol", bullets: ["Chronological Splitting: 80% train (Jan 2020 – Sep 2024), 20% future test (Oct 2024 – Dec 2025). Zero random shuffling.", "Walk-Forward Validation: Multi-step ahead rollouts across 7, 15, 30, and 60-day horizons.", "Standard Evaluation Metrics: MAE, RMSE, MAPE, sMAPE, WAPE, and R² Score.", "Ablation Studies: Evaluating independent contributions of weather features, arrival volumes, and feature selection methods.", "10 Structured Scientific Experiments: Documented in docs/reports/experimental_analysis_report.md."] },
      { title: "Model Comparison and Actual Results", sub: "Empirical Benchmark on Benchmark Series (Vatakara Arecanut)", bullets: ["Naive Baseline: RMSE ₹2,163.16/Qtl | MAPE 3.05% | R² -0.464", "SARIMA(1,1,1): RMSE ₹1,784.75/Qtl | MAPE 2.56% | R² 0.003", "Random Forest: RMSE ₹1,433.36/Qtl | MAPE 2.05% | R² 0.357", "XGBoost Regressor: RMSE ₹1,255.46/Qtl | MAPE 1.78% | R² 0.507", "LightGBM Regressor: RMSE ₹1,209.59/Qtl | MAPE 1.68% | R² 0.542", "Deep Attention MLP: RMSE ₹1,069.93/Qtl | MAPE 1.37% | R² 0.642", "Hybrid SARIMA+XGBoost (7-Day): RMSE ₹602.28/Qtl | MAPE 1.45% | R² 0.884 (Top Overall)"] },
      { title: "Application Demonstration", sub: "KrishiMitra AI Production Web Platform", bullets: ["Farmer Dashboard: Real-time spot price cards, meteorological alerts, and volatility gauges.", "Crop Forecasting: Interactive Plotly chart with 80% and 95% calibrated confidence intervals.", "Market Arbitrage Engine: Compares nearby mandis, deducts road freight, and identifies maximum net return.", "Intelligent Crop Planner: Calculates projected yield, cultivation costs, net margins, and risk ratings.", "Explainable AI: Translates SHAP values into plain-language agricultural drivers."] },
      { title: "Future Scope and Scalability", sub: "Pathways for Academic and Statewide Expansion", bullets: ["Multilingual Voice AI: Speech-to-text advisory in Malayalam dialects for marginal farmers.", "Satellite Remote Sensing: Sentinel-2 NDVI vegetative indices for real-time yield forecasts.", "Spatio-Temporal Graph Neural Networks (ST-GCN): Modeling cross-mandi physical trade flows.", "Integration with Kerala Agriculture Department (KAU / Haritha Keralam / VFPCK) digital initiatives."] },
      { title: "Conclusion and References", sub: "Transforming Agricultural Market Intelligence for YIP 9.0", bullets: ["Summary: Successfully built, scientifically evaluated, and deployed an end-to-end agricultural forecasting platform.", "Empirical Evidence: Hybrid SARIMA + XGBoost reduces error by 66% over classical statistical baselines.", "Key Citations: Sabu & Manoj Kumar (2020), Ananthi et al. (2020), TNAU RKVY (2018), UAS Bangalore (2021), Liu et al. (2022).", "Project Repository: Fully reproducible code, datasets, reports, IEEE paper, and test suite."] }
    ];

    let currentSlide = 0;
    const wrapper = document.getElementById("slides-wrapper");
    const dotsContainer = document.getElementById("slide-dots");
    const counter = document.getElementById("slide-counter");

    // Render slides HTML
    wrapper.innerHTML = slidesData.map((s, idx) => `
      <div class="slide ${idx === 0 ? 'slide-active' : 'hidden'} flex-col bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-10 shadow-2xl transition duration-200">
        <div class="mb-6">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Section ${idx + 1}</span>
          <h2 class="text-2xl md:text-3xl font-extrabold text-white mt-1">${s.title}</h2>
          <p class="text-sm md:text-base text-slate-400 italic mt-1">${s.sub}</p>
        </div>
        <div class="space-y-4 my-auto bg-slate-950/60 p-6 rounded-xl border border-slate-800/80">
          ${s.bullets.map(b => `
            <div class="flex items-start gap-3">
              <span class="text-emerald-400 mt-1"><i class="fa-solid fa-circle-check text-xs"></i></span>
              <p class="text-sm md:text-base text-slate-200 leading-relaxed">${b}</p>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');

    // Render dots
    dotsContainer.innerHTML = slidesData.map((_, idx) => `
      <button onclick="goToSlide(${idx})" class="w-2.5 h-2.5 rounded-full ${idx === 0 ? 'bg-emerald-500' : 'bg-slate-700'} hover:bg-slate-500 transition"></button>
    `).join('');

    function updateSlide() {
      const allSlides = document.querySelectorAll(".slide");
      const allDots = dotsContainer.querySelectorAll("button");
      allSlides.forEach((s, idx) => {
        if (idx === currentSlide) {
          s.classList.add("slide-active");
          s.classList.remove("hidden");
        } else {
          s.classList.remove("slide-active");
          s.classList.add("hidden");
        }
      });
      allDots.forEach((d, idx) => {
        d.className = `w-2.5 h-2.5 rounded-full ${idx === currentSlide ? 'bg-emerald-500' : 'bg-slate-700'} hover:bg-slate-500 transition`;
      });
      counter.innerText = `Slide ${currentSlide + 1} / 20`;
    }

    function goToSlide(idx) {
      currentSlide = idx;
      updateSlide();
    }

    document.getElementById("btn-prev").addEventListener("click", () => {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        updateSlide();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") {
        if (currentSlide < slidesData.length - 1) { currentSlide++; updateSlide(); }
      } else if (e.key === "ArrowLeft") {
        if (currentSlide > 0) { currentSlide--; updateSlide(); }
      }
    });
  </script>
</body>
</html>
